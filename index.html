<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#05060a" />
<title>The Lands Unknown — A Chronicle of the Churn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9A%94%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <div id="main-col">
    <div id="map-wrap">
      <canvas id="map"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="log" class="log"></div>
  </div>
  <aside id="sidebar">
    <canvas id="minimap" width="240" height="160"></canvas>
    <div id="stats"></div>
    <div id="controls">
      <div class="ctrl-h">Controls</div>
      <div>Move · ↑↓←→ / WASD</div>
      <div>Interact · Enter</div>
      <div>Inventory · I &nbsp; Character · C</div>
      <div>Quests · Q &nbsp; Talents · P &nbsp; Codex · L</div>
      <div>Map · M &nbsp; Theme · T &nbsp; Help · ? &nbsp; Pause · Esc</div>
    </div>
  </aside>
</div>

<!-- data layer -->
<script src="src/rng.js"></script>
<script src="src/data/lore.js"></script>
<script src="src/data/skills.js"></script>
<script src="src/data/perks.js"></script>
<script src="src/data/companions.js"></script>
<script src="src/data/items.js"></script>
<script src="src/data/abilities.js"></script>
<script src="src/data/bestiary.js"></script>
<script src="src/data/quests.js"></script>
<script src="src/data/dialogue.js"></script>
<!-- content framework + packs (author content here; see content/CONTENT_GUIDE.md) -->
<script src="src/content/registry.js"></script>
<script src="content/example-pack.js"></script>
<!-- generation -->
<script src="src/world.js"></script>
<script src="src/dungeon.js"></script>
<!-- engine -->
<script src="src/player.js"></script>
<script src="src/combat.js"></script>
<script src="src/save.js"></script>
<script src="src/dynasty.js"></script>
<!-- generative ink art (Folio): deterministic SVG portraits, beast plates, lexicon -->
<script src="src/art/ink.js"></script>
<script src="src/art/portrait.js"></script>
<script src="src/art/beast.js"></script>
<script src="src/art/scenes.js"></script>
<script src="src/art/lexicon.js"></script>
<!-- presentation -->
<script src="src/theme.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>
<script src="src/battlefx.js"></script>
<script src="src/intro.js"></script>
<script src="src/screens.js"></script>
<script src="src/touch.js"></script>
<script src="src/main.js"></script>
</body>
</html>
